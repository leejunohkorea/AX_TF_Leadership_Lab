 case'rg-skip':if(S.stage===3&&S.rollgame&&!S.rollgame.done&&!S.rollgame.tier){rgSkip();document.getElementById('modal').close();top=true}break;
 case'rg-practice':wsReset();wsPractice=false;rgReset();rgPractice=true;document.getElementById('modal').close();top=true;break;
 case'rg-exit':rgReset();rgPractice=false;top=true;break;
 case'rg-scale':rgSetScale(Number(b.dataset.id));return facModal();
 case'ws-people':if(!WS)mcInit(id);WS.people=id;break;
 case'ws-start':if(wsInWorkshop()&&WS&&WS.stage==='intro')return mcStartWarm();return;
 case'ws-skipwarm':if(wsInWorkshop()&&WS&&WS.stage==='intro'){WS.warm=null;WS.stage='warmdone';render();goTop()}return;
 case'ws-solo':if(wsInWorkshop()&&WS&&WS.stage==='warmdone')return mcStartSolo();return;
 case'ws-plan':if(wsInWorkshop()&&WS&&WS.stage==='warmdone')return mcStartPlan();return;
 case'ws-go':if(wsInWorkshop()&&WS&&WS.stage==='plan')return mcStartMain();return;
 case'ws-pv':mcSetPreview(id);return facModal();
 case'ws-flip':return mcFlip(id);
 case'ws-choose':if(!wsPractice&&wsInWorkshop())wsChoose(b.dataset.id);break;
 case'ws-continue':if(!wsPractice&&S.workshop&&S.workshop.tier&&(S.workshop.choice||S.workshop.tier==='done')){S.workshop.done=true;wsReset();advanceRound();top=true}break;
 case'ws-skip':if(S.stage===3&&S.workshop&&!S.workshop.done&&!S.workshop.tier){wsReset();wsApply(null,null);document.getElementById('modal').close();top=true}break;
 case'ws-practice':wsReset();rgReset();rgPractice=false;wsPractice=true;document.getElementById('modal').close();top=true;break;
 case'ws-exit':wsReset();wsPractice=false;top=true;break;
 default:return;
 }
 render();if(top)goTop();
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='teamname'){S.name=t.value;save()}if((t.id==='mv-task'||t.id==='mv-to')&&S.move){S.move[t.id==='mv-task'?'task':'to']=Number(t.value);render()}});
document.addEventListener('input',e=>{if(e.target.id==='reason'){S.note=e.target.value;save()}if(e.target.id==='kickmsg'){S.kickMsg=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.id==='rg-agree'&&RG){RG.agree=e.target.checked;render()}});
document.getElementById('import').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw new Error('파일이 너무 큽니다.');const r=JSON.parse(await file.text());if(r.schema!=='ax-tf-result-v2'||r.model!==VERSION||typeof r.id!=='string'||typeof r.name!=='string'||!r.scores||!['total','mission','tasks','balance','learning'].every(k=>typeof r.scores[k]==='number'&&Number.isFinite(r.scores[k])&&r.scores[k]>=0&&r.scores[k]<=100))throw new Error('이 버전('+VERSION+')의 결과 JSON이 아닙니다.');const bo=r.scores.bonus==null?0:r.scores.bonus;if(typeof bo!=='number'||!(bo>=0&&bo<=1.5))throw new Error('보너스 값이 올바르지 않습니다.');if(Math.abs(r.scores.total-Math.min(100,r.scores.mission*.25+r.scores.tasks*.30+r.scores.balance*.25+r.scores.learning*.20+bo))>.01)throw new Error('점수 산식이 맞지 않습니다.');recordResult(r);rankingModal();toast(r.name+' 결과를 가져왔습니다.')}catch(err){toast('가져오기 실패: '+err.message)}e.target.value=''});

// 팀원 정보 카드: 마우스를 올리면(터치는 탭하면) 표시
const pcard=document.createElement('div');pcard.id='pcard';pcard.setAttribute('role','tooltip');pcard.className='hide';document.body.append(pcard);
let pcTarget=null,pcTimer=null,pcAt=0;
function pcShow(el){const id=Number(el.dataset.pid);if(Number.isNaN(id)||(id!==-1&&!PEOPLE[id]))return;const task=el.dataset.ptask!=null?Number(el.dataset.ptask):null;pcTarget=el;pcAt=Date.now();pcard.innerHTML=personCard(id,task);pcard.classList.remove('hide');
 const r=el.getBoundingClientRect(),cw=pcard.offsetWidth,ch=pcard.offsetHeight,vw=innerWidth,vh=innerHeight;let x=r.left+r.width/2-cw/2,y=r.bottom+10;
 if(y+ch>vh-8)y=r.top-ch-10;if(y<8)y=Math.max(8,Math.min(vh-ch-8,r.bottom+10));x=Math.max(8,Math.min(vw-cw-8,x));pcard.style.left=x+'px';pcard.style.top=y+'px'}
function pcHide(){pcTarget=null;pcard.classList.add('hide')}
document.addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const el=e.target.closest('[data-pid]');if(el&&el!==pcTarget)pcShow(el)});
document.addEventListener('pointerout',e=>{if(e.pointerType==='touch')return;const el=e.target.closest('[data-pid]');if(el&&!el.contains(e.relatedTarget))pcHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-pid]');if(el)pcShow(el)});
document.addEventListener('focusout',()=>pcHide());
document.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')return;const el=e.target.closest('[data-pid]');clearTimeout(pcTimer);if(el){setTimeout(()=>{const fresh=el.isConnected?el:document.querySelector(`[data-pid="${el.dataset.pid}"]${el.dataset.ptask!=null?`[data-ptask="${el.dataset.ptask}"]`:''}`);if(fresh)pcShow(fresh)},250);pcTimer=setTimeout(pcHide,3800)}else pcHide()});
addEventListener('scroll',()=>{if(pcTarget&&Date.now()-pcAt>700)pcHide()},{passive:true});
try{if(localStorage.getItem(KEY+'-present'))document.body.classList.add('present')}catch(e){}
render();
