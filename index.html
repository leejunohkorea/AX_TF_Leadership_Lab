<!DOCTYPE html>
<html lang="ko">
<head>
<script src="firebase-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AX TF Leadership Lab v5 · 굿인사이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@700&display=swap">
<style>
:root{
--bg:#f1f0e9;--paper:#fff;--ink:#10262e;--ink2:#1c3b45;--muted:#5d6e74;--line:#dde2da;--line2:#c9d2cb;
--green:#0a8070;--green-d:#076457;--green-soft:#e2efe8;--lime:#d5ec8c;--coral:#d4602c;--coral-soft:#fbe9dd;
--amber:#b9850c;--amber-soft:#fbf1d6;--red:#bf3b28;--red-soft:#fbe4df;--blue:#5a73b6;--blue-soft:#e8ecf7;
--shadow:0 1px 2px #10262e0d,0 10px 30px #10262e0a;--r:18px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body.present{font-size:17.5px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line2);border-radius:11px;background:#fff;padding:10px 16px;font-weight:700;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--green);transform:translateY(-1px)}
button:disabled{opacity:.38;cursor:not-allowed}
:focus-visible{outline:3px solid #e0a23a;outline-offset:3px}
.primary{background:var(--green);border-color:var(--green);color:#fff}
.primary:hover:not(:disabled){background:var(--green-d)}
.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.ghost{background:transparent}
.small{padding:6px 11px;font-size:13px;border-radius:9px}
.big{padding:14px 24px;font-size:16px;border-radius:13px}
h1,h2,h3,h4,p{margin-top:0}
h1{font-size:40px;line-height:1.28;letter-spacing:-.045em;margin-bottom:14px;font-weight:800}
h2{font-size:26px;letter-spacing:-.035em;line-height:1.38;margin-bottom:10px;font-weight:800}
h3{font-size:18px;line-height:1.45;margin-bottom:8px;letter-spacing:-.02em}
p{margin-bottom:14px}
.muted{color:var(--muted)}.tiny{font-size:12px}.center{text-align:center}
.hide{display:none!important}

/* header */
header.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:12px 28px;display:flex;justify-content:space-between;align-items:center;gap:14px}
header.top button{background:#ffffff10;border-color:#ffffff2c;color:#fff}
header.top button:hover:not(:disabled){border-color:var(--lime)}
.brand{font-size:16px;font-weight:800;letter-spacing:.03em;white-space:nowrap}.brand i{font-style:normal;color:var(--lime)}
.brand small{display:block;font-size:10.5px;font-weight:500;opacity:.6;letter-spacing:.12em}
.timer{font-weight:800;font-size:15px;padding:5px 12px;border-radius:9px;background:var(--lime);color:var(--ink);letter-spacing:.04em}
.timer.over{background:var(--coral);color:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
main{max-width:1280px;margin:auto;padding:30px 28px 70px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{padding:5px 12px;border-radius:30px;font-size:12px;color:var(--muted);background:#e4e7df;font-weight:600}
.step.active{background:var(--ink);color:#fff}.step.done{color:var(--green);background:var(--green-soft)}
.eyebrow{color:var(--green);font-weight:800;font-size:12px;letter-spacing:.12em;margin-bottom:10px;text-transform:uppercase}
.intro{max-width:780px;font-size:16.5px;color:var(--muted)}
.grid{display:grid;gap:18px}.two{grid-template-columns:1.2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--paper);padding:24px;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel.tint{background:#e8eee3;border-color:#d7e0d1}
.panel.navy{background:var(--ink);color:#fff;border:none}
.navy .muted{color:#a9bdbb}
.spacing{margin-top:22px}.spacing-s{margin-top:12px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.nowrap{flex-wrap:nowrap}
.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:22px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--green-soft);color:var(--green-d);font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;margin:0 4px 5px 0;white-space:nowrap}
.pill.orange{background:var(--coral-soft);color:#a8461d}.pill.amber{background:var(--amber-soft);color:#87610a}.pill.blue{background:var(--blue-soft);color:#3f5694}.pill.dark{background:#ffffff18;color:var(--lime)}
.track{height:7px;background:#e7ebe5;border-radius:9px;overflow:hidden}.track>span{display:block;background:var(--green);height:100%;border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.track.thick{height:11px}
.note{padding:13px 16px;border-left:3px solid var(--green);background:var(--green-soft);border-radius:0 10px 10px 0;font-size:13.5px}
.note.warning{border-color:var(--coral);background:var(--coral-soft)}
.divider{border-top:1px solid var(--line);margin:20px 0}

/* stat */
.stat{font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.04em}.stat small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.delta{font-size:12px;font-weight:800;padding:2px 8px;border-radius:7px;background:var(--green-soft);color:var(--green-d)}
.delta.neg{background:var(--coral-soft);color:#a8461d}.delta.zero{background:#eceee9;color:var(--muted)}
.metric{padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:14px}
.metric .label{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:6px}
.metric .stat{margin:6px 0 9px}

/* mission */
.hero{padding:40px;position:relative;overflow:hidden}
.hero h1{font-size:52px;line-height:1.2}.hero b{color:var(--lime)}
.hero:after{content:'';position:absolute;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,#d5ec8c22,transparent 70%)}
.tag{font-size:11px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;color:var(--lime)}
.crisis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0}
.crisis>div{background:#ffffff0b;border:1px solid #ffffff1f;border-radius:15px;padding:18px}
.crisis b{font-size:22px;display:block;margin-bottom:6px}.crisis p{margin:0;font-size:14.5px;color:#cfdcda}
.mini-icon{width:56px;height:56px;margin-bottom:8px}
.mission-call{font-size:26px;line-height:1.5;font-weight:800;letter-spacing:-.03em}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 4px}
.flow div{background:#f3f5f0;border-radius:11px;padding:11px 10px;font-size:12.5px;line-height:1.45}
.flow b{display:block;font-size:11px;color:var(--green);letter-spacing:.08em}
input[type=text],textarea,select{width:100%;border:1px solid var(--line2);background:#fff;padding:11px 12px;border-radius:10px}
textarea{resize:vertical}
label{font-weight:700;font-size:13px;display:block}label>input,label>select,label>textarea{margin-top:7px;font-weight:400}

/* leader */
.axis{display:grid;grid-template-columns:150px 1fr 108px;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.axis:last-child{border-bottom:0}.axis small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.control{display:flex;align-items:center;justify-content:space-between;gap:4px}.control button{padding:0;width:32px;height:32px}.control b{font-size:18px}
.radar{width:100%;max-width:340px;display:block;margin:auto;overflow:visible}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--green)}.dot.blue{background:var(--blue)}
.leader-visual{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:center}
.effect-list{display:grid;gap:6px;margin-top:12px;font-size:13px}
.effect-list div{display:flex;justify-content:space-between;background:#fff;border-radius:9px;padding:7px 11px}

/* recruit */
.portrait{width:100%;height:auto;display:block;border-radius:16px}
.recruit-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.roster-list{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;padding:3px}
.applicant{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;margin-bottom:8px;border:2px solid transparent;box-shadow:0 0 0 1px var(--line);background:#fff}
.applicant.focus{border-color:var(--green);background:#eef6ef}
.applicant.picked{background:#f5faf3}
.applicant .portrait{width:46px;flex:none;border-radius:10px}
.applicant strong{font-size:16px}.applicant small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.check{margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:12px;flex:none}
.profile{padding:30px}
.profile-head{display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:center}
.profile-head h2{font-size:34px;margin:0}
.profile-lead{font-size:19px;line-height:1.7;margin:18px 0;font-weight:600}
.profile-grid{display:grid;grid-template-columns:1fr 290px;gap:24px}
.dossier-block{padding:16px 0;border-bottom:1px solid var(--line)}
.dossier-block h3{font-size:13px;color:var(--green);margin-bottom:6px;letter-spacing:.02em}
.dossier-block p{font-size:16px;margin:0;line-height:1.75}
.hearsay{background:var(--amber-soft);border-radius:12px;padding:18px;margin-top:18px}.hearsay h3{color:#87610a;font-size:14px}
.hint{background:var(--blue-soft);padding:18px;border-radius:12px;margin-top:14px}.hint h3{color:#3f5694;font-size:14px}
.selected-tray{margin:0 0 20px;padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:66px;z-index:5;box-shadow:var(--shadow)}
.tray-faces{display:flex;gap:6px;align-items:center}
.face{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none;background:#e8eee5}
.face.empty{border:2px dashed var(--line2);background:transparent}
.face .portrait{border-radius:0}
.dossier-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#fbfcf7;border-top:1px solid var(--line);padding:16px;margin:22px -12px -12px;border-radius:12px}

/* HUD */
.hud{position:sticky;top:62px;z-index:20;background:#ffffffeb;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;gap:6px;align-items:center;box-shadow:var(--shadow);margin:18px 0;overflow-x:auto}
.hud-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em;line-height:1.3;padding-right:8px;border-right:1px solid var(--line);margin-right:4px;white-space:nowrap}
.hud-p{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:12px;min-width:150px;background:transparent;border:0;text-align:left}
.hud-p:hover{background:#f1f4ee;transform:none}
.ringwrap{position:relative;width:46px;height:46px;flex:none}
.ringwrap .portrait{position:absolute;inset:6px;width:34px;border-radius:50%}
.ringwrap svg.ring{position:absolute;inset:0}
.hud-p b{font-size:13px;display:block;line-height:1.25;white-space:nowrap}
.hud-p small{font-size:11px;color:var(--muted);display:block;white-space:nowrap}
.lv-ok{color:var(--green)}.lv-warn{color:var(--amber)}.lv-over{color:var(--red)}
.fdots{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle}.fdots i{width:5px;height:5px;border-radius:50%;background:#dfe3dc}.fdots i.on{background:var(--coral)}

/* situation */
.situation{background:var(--ink);color:#fff;border-radius:22px;padding:34px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:30px;position:relative;overflow:hidden}
.situation:before{content:attr(data-day);position:absolute;right:24px;bottom:-30px;font-size:150px;font-weight:900;letter-spacing:-.06em;color:#ffffff07;line-height:1;pointer-events:none}
.situation h1{color:#fff;font-size:38px;margin:10px 0 16px}
.situation .problem{font-size:17.5px;line-height:1.85;color:#d9e5e3;margin:0}
.roundstrip{display:flex;gap:6px;margin:4px 0 0}.roundstrip span{flex:1;height:5px;background:#ffffff1c;border-radius:9px}.roundstrip .done{background:var(--lime)}.roundstrip .active{background:#ffffff80}
.speaker{align-self:end;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:end}
.speaker .portrait{border-radius:14px}
.speech{background:#fff;color:var(--ink);border-radius:16px 16px 16px 4px;padding:16px 18px;font-size:17px;font-weight:700;line-height:1.6;position:relative}
.speech small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:6px}
.eventcard{grid-column:1/-1;display:flex;gap:16px;align-items:flex-start;background:#ffffff0d;border:1px solid #ffffff22;border-radius:14px;padding:14px 16px}
.eventcard .ico{flex:none;width:38px;height:38px;border-radius:10px;background:var(--coral);display:grid;place-items:center;font-weight:900;font-size:18px}
.eventcard.info .ico{background:var(--green)}
.eventcard.fac .ico{background:var(--amber)}
.eventcard b{display:block;font-size:15px}.eventcard p{margin:2px 0 0;font-size:13.5px;color:#cbd9d7}
.events{grid-column:1/-1;display:grid;gap:10px}

/* decision */
.stephead{display:flex;align-items:center;gap:12px;margin:30px 0 14px}
.stepno{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.stephead h2{margin:0;font-size:22px}
.stephead .sub{margin-left:auto}
.choice{display:flex;flex-direction:column;text-align:left;width:100%;padding:22px;border:2px solid var(--line);border-radius:16px;height:100%;background:#fff;position:relative}
.choice .letter{width:34px;height:34px;border-radius:10px;background:#eef1ea;display:grid;place-items:center;font-weight:900;color:var(--ink2);margin-bottom:12px}
.choice h3{font-size:18px}
.choice p{font-weight:500;font-size:14px;margin:0;color:var(--ink2);line-height:1.65}
.choice.selected{border-color:var(--green);background:#f3faf4;box-shadow:0 0 0 4px #0a807018}
.choice.selected .letter{background:var(--green);color:#fff}
.choice .tagrow{margin-top:auto;padding-top:14px}
.ivgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.iv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:8px}
.iv h4{margin:0;font-size:15px}
.iv p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.iv select{padding:7px 9px;font-size:13px}
.iv button{margin-top:auto}
.pips{display:inline-flex;gap:3px}.pips i{width:9px;height:9px;border-radius:3px;background:var(--ink2)}.pips i.off{background:#dfe4dc}
.budget{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px}
.budget .pips i{width:16px;height:16px;border-radius:5px}
.chosen-ivs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chosen-ivs span{background:var(--ink);color:#fff;border-radius:10px;padding:6px 6px 6px 12px;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.chosen-ivs button{background:#ffffff22;border:0;color:#fff;padding:0 8px;border-radius:7px;font-size:12px}
.commitbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:18px}
.checklist{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:600}
.checklist span{color:var(--muted)}.checklist span.ok{color:var(--green)}

/* courses */
.course{width:100%;text-align:left;padding:18px;display:flex;flex-direction:column;gap:6px;border-radius:14px}
.course strong{font-size:16px}.course span{font-size:13px;font-weight:500;color:var(--muted);line-height:1.55}
.course.done{background:#eceee9;opacity:.6}

/* assignment */
.worklayout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.taskcards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.taskcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.taskcard.unset{border-style:dashed;border-color:var(--line2)}
.taskcard h3{font-size:16px;margin:0}
.taskcard p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 2px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid var(--line)}
.chip .face{width:22px;height:22px;border-radius:50%}
.chips{gap:4px}
.chip.on{border-color:var(--green);background:var(--green-soft);color:var(--green-d)}
.fitline{font-size:12px;font-weight:700}
.loadcard{padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.loadcard.over{background:var(--red-soft);border-color:#efc2b8}
.loadcard .face{width:34px;height:34px}
.sidebar{position:sticky;top:78px}

/* result */
.newsstrip{background:#fffdf5;border:1px solid #e7e1c8;border-radius:16px;padding:20px 24px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;box-shadow:var(--shadow)}
.newsstrip .kicker{font-size:11px;font-weight:900;letter-spacing:.14em;color:#87610a;writing-mode:horizontal-tb;border-right:2px solid #e7dcb5;padding-right:18px;line-height:1.4}
.newsstrip h2{margin:0;font-family:'Noto Serif KR',Georgia,serif;font-size:25px;letter-spacing:-.03em}
.reveal-trade{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.alt{padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}.alt:last-child{border:0}
.alt b{display:block}
.bubbles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.bubble{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;opacity:0;transform:translateY(8px);animation:pop .5s cubic-bezier(.2,.8,.2,1) forwards}
.bubble .portrait{border-radius:12px}
.bubble .speech{border:1px solid var(--line);border-radius:4px 16px 16px 16px;font-size:15px;font-weight:600;padding:13px 15px}
.bubble .speech.neg{background:#fff6f1;border-color:#f0d1c1}
.bubble .speech.pos{background:#f4faf2;border-color:#cfe4cf}
.bubble .who{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
@keyframes pop{to{opacity:1;transform:none}}
.innercard{background:var(--blue-soft);border-radius:16px;padding:18px 20px;display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:center}
.innercard .portrait{border-radius:50%}
.innercard q{font-size:17px;font-weight:700;quotes:'“' '”'}
.reveal{border:1px solid #bdd39c;background:#f1f7e7;padding:18px;border-radius:14px;display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center}
.reveal p{margin:4px 0 0}
.verdict{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:16px;background:var(--green-soft)}
.verdict.fail{background:var(--coral-soft)}
.verdict .seal{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid var(--green);color:var(--green);display:grid;place-items:center;font-weight:900;font-size:14px;transform:rotate(-8deg);background:#fff}
.verdict.fail .seal{border-color:var(--coral);color:var(--coral)}
.scorecards .stat{font-size:30px}
.concept{background:var(--ink);color:#fff;border-radius:16px;padding:20px 22px}
.concept b{color:var(--lime);font-size:12px;letter-spacing:.1em}
.concept h4{margin:6px 0 6px;font-size:17px}.concept p{margin:0;font-size:13.5px;color:#cbd9d7}
.question{font-size:21px;font-weight:800;line-height:1.55;letter-spacing:-.02em}

/* board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.board-col h4{font-size:13px;margin:0 0 8px;color:var(--ink2);display:flex;gap:6px;align-items:center}

const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const sum=a=>a.reduce((s,x)=>s+x,0);
const r1=x=>Math.round(x*10)/10;
const NT=TASKS.length;
function fresh(){return {version:5,stage:0,name:'',mode:'team',leaderType:null,team:[],round:0,revealed:[],kickoffDone:false,assignDone:false,assignEditing:false,assignBackup:null,assignments:Array(NT).fill(null),initialAssignments:null,recommended:null,skills:{},fatigue:{},shared:10,backup:10,helpMode:'adhoc',metrics:[0,50,50],history:[],pick:null,ivs:[],move:null,note:'',kickMsg:'',feedback:false,pressure:null,facEvents:{},id:'tf-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)}}
let S=fresh(),storageOK=true;
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===5&&Array.isArray(v.history)&&v.stage>=0&&v.stage<=4&&Array.isArray(v.assignments)&&v.assignments.length===NT)S=Object.assign(fresh(),v)}catch(e){storageOK=false}

// ───────── 인물·역량 ─────────
function leaderV(){return (LEADERS[S.leaderType]||LEADERS.drive).v}
function person(id){return id===-1?{id:-1,n:'리더(나)',role:'TF 리더 · '+(LEADERS[S.leaderType]?LEADERS[S.leaderType].n:''),v:leaderV()}:PEOPLE[id]}
function nameOf(id){return id===-1?'리더(나)':PEOPLE[id].n}
function roster(){return [-1,...S.team].map(person)}
function effective(p){const sk=S.skills[p.id]||[];return p.v.map((v,i)=>Math.min(10,v+(sk[i]||0)+(p.id!==-1&&S.revealed.includes(p.id)&&p.hiddenAxis===i?p.hiddenGain:0)))}
function addSkill(id,axis,g){if(!S.skills[id])S.skills[id]=Array(4).fill(0);S.skills[id][axis]+=g}
function growthFactor(ai){return ai<6?1:ai<8?.35:.1}
function aiOf(id){return effective(person(id))[0]}

// ───────── 상태 말 (숫자 대신) ─────────
function loadWord(l){return l>CAP?'과부하':l>CAP-1.5?'빠듯':'여유'}
function loadLv(l){return l>CAP?'over':l>CAP-1.5?'warn':'ok'}

// ───────── 라운드 변수 ─────────
function roundEvents(round=S.round){const r=ROUNDS[round],out=[];if(r.event)out.push({...EVENTS[r.event],key:r.event,kind:EVENTS[r.event].info?'info':'field'});(S.facEvents[round]||[]).forEach(id=>{const e=FAC_EVENTS.find(x=>x.id===id);if(e)out.push({...e,key:id,kind:'fac'})});if(S.pressure===round)out.push({key:'pressure',kind:'field',title:'중간보고 후속 압박',desc:'기관장이 매주 진척을 확인합니다. 이번 라운드 전원 부담 증가.',extraAll:.5});return out}
function mods(round=S.round){const m={taskMult:Array(NT).fill(1),aiEff:1,helpMult:1,extraAll:0,absent:false,oppDouble:false};for(const e of roundEvents(round)){if(e.taskMult)for(const k in e.taskMult)m.taskMult[k]*=e.taskMult[k];if(e.aiEff)m.aiEff*=e.aiEff;if(e.helpMult)m.helpMult*=e.helpMult;if(e.extraAll)m.extraAll+=e.extraAll;if(e.absent)m.absent=true;if(e.oppDouble)m.oppDouble=true}return m}
function expertId(){return [...S.team].sort((a,b)=>aiOf(b)-aiOf(a))[0]}
function ivCost(list=S.ivs){return sum(list.map(i=>IV[i.type].cost))}

// ───────── 핵심 계산 ─────────
function assess(o=null,ivs=[],round=S.round,assign=S.assignments){
 const ppl=roster(),ev=new Map(ppl.map(p=>[p.id,effective(p)])),m=mods(round);
 const own=new Map(ppl.map(p=>[p.id,0])),help=new Map(ppl.map(p=>[p.id,0])),extra=new Map(ppl.map(p=>[p.id,0]));
 const add=(mp,k,v)=>mp.set(k,(mp.get(k)||0)+v);
 const mode=o?o.mode:S.helpMode,cost=o?o.cost:0,lt=S.leaderType;
 const absentId=m.absent?expertId():null;
 const recent=S.history.at(-1);
 const pairs=ivs.filter(i=>i.type==='pair');
 const tasks=TASKS.map((t,i)=>{
  const id=assign[i],v=ev.get(id),ai=v[0];
  const eff=1+t.ai*Math.max(0,ai-3)*.1*m.aiEff;
  const ownLoad=t.load*m.taskMult[i]/eff;add(own,id,ownLoad);
  let need=t.load*t.ai*Math.max(0,6-ai)*.13*(1-S.shared/130)*m.helpMult;
  if(mode==='self')need*=.65;
  const pr=pairs.find(x=>x.b===id&&x.a!==id&&!(absentId!==null&&x.a===absentId));
  if(pr)add(help,pr.a,need*.6);
  else{const cand=ppl.filter(p=>p.id!==id&&p.id!==absentId).sort((a,b)=>ev.get(b.id)[0]-ev.get(a.id)[0]);const hs=mode==='guided'?cand.slice(0,3):cand.slice(0,1);hs.forEach(h=>add(help,h.id,need/hs.length))}
  const fit=clamp(avg(t.axes.map(a=>v[a]))/t.need*75);
  const best=avg(t.axes.map(a=>Math.max(...ppl.map(p=>ev.get(p.id)[a]))))/t.need*75;
  const transfer=Math.max(0,best-fit)*(S.shared/100)*.5;
  const disruption=id===absentId?(1-S.backup/100)*35:0;
  const handover=recent&&recent.assignments[i]!==id?6*(1-S.backup/120):0;
  return {i,id,fit,transfer,own:ownLoad,disruption,handover,weight:t.kind==='중요'?2:1};
 });
 ivs.forEach(iv=>{add(extra,-1,IV[iv.type].leaderLoad);if(iv.type==='pair')add(extra,iv.a,.8);if(iv.type==='help')add(extra,iv.a,-1.5)});
 if(mode==='central'){const ex=[-1,...S.team].filter(id=>id!==absentId).sort((a,b)=>ev.get(b)[0]-ev.get(a)[0])[0];add(extra,ex,1.2)}
 if(S.leaderRest===round)add(extra,-1,-1);
 if(lt==='drive')S.team.forEach(id=>add(extra,id,.25));
 if(lt==='analyst')add(extra,-1,.8);
 const per=ppl.map(p=>{
  const ai=ev.get(p.id)[0],o2=own.get(p.id),sup=help.get(p.id);
  const coaching=cost*(mode==='guided'&&ai>=6?1.5:1);
  const load=Math.max(0,o2+sup+coaching+m.extraAll+extra.get(p.id));
  const mine=tasks.filter(t=>t.id===p.id),imp=mine.filter(t=>TASKS[t.i].kind==='중요').length;
  return {id:p.id,n:nameOf(p.id),ai,baseAI:p.v[0],own:o2,support:sup,coaching,load,fatigue:S.fatigue[p.id]||0,count:mine.length,imp,routine:sum(mine.filter(t=>TASKS[t.i].kind==='반복').map(t=>TASKS[t.i].load)),moved:recent?mine.filter(t=>recent.assignments[t.i]!==p.id).length:0,opportunity:mine.length===0?0:imp>0?100:55,absent:p.id===absentId};
 });
 tasks.forEach(t=>{const w=per.find(p=>p.id===t.id),over=Math.max(0,w.load-CAP);t.quality=clamp(t.fit+t.transfer-over*5-w.fatigue*.7-t.disruption-t.handover+(lt==='analyst'?1.2:0))});
 const taskScore=sum(tasks.map(t=>t.quality*t.weight))/sum(tasks.map(t=>t.weight));
 const sustainability=clamp(100-sum(per.map(p=>Math.max(0,p.load-CAP)))*10-avg(per.map(p=>p.fatigue))*2);
 const supSum=sum(per.map(p=>p.support)),conc=supSum>.05?Math.max(...per.map(p=>p.support))/supSum:0;
 const dependence=clamp(100-conc*45*(1-S.backup/100));
 const opportunity=avg(per.map(p=>p.opportunity));
 const balance=sustainability*.5+dependence*.25+opportunity*.25;
 const low=ppl.filter(p=>p.v[0]<6),grp=low.length?low:ppl;
 const growth=clamp(avg(grp.map(p=>Math.max(0,ev.get(p.id)[0]-p.v[0])))/5*100);
 const learning=growth*.6+S.shared*.2+S.backup*.2;
 return {per,tasks,taskScore,sustainability,dependence,opportunity,balance,growth,learning,absentId,shared:S.shared,backup:S.backup,overCount:per.filter(p=>p.load>CAP).length};
}
function acceptance(o){return avg(S.team.map(id=>{const p=PEOPLE[id];return o.tags.some(t=>p.likes.includes(t))?1:o.tags.some(t=>p.dislikes.includes(t))?-1:0}))}

// ───────── 업무 이동 (5라운드 B·C) ─────────
function suggestMove(kind){
 const a=assess(),team=a.per.filter(p=>p.id!==-1);
 if(kind==='busy'){const busy=[...a.per].sort((x,y)=>y.load-x.load)[0];const tk=TASKS.map((t,i)=>i).filter(i=>S.assignments[i]===busy.id).sort((x,y)=>TASKS[y].load-TASKS[x].load)[0];const to=[...a.per].filter(p=>p.id!==busy.id).sort((x,y)=>x.load-y.load)[0];return {task:tk,to:to.id}}
 const lowp=[...team].sort((x,y)=>x.imp-y.imp||y.routine-x.routine)[0];const tk=TASKS.map((t,i)=>i).filter(i=>TASKS[i].kind==='중요'&&S.assignments[i]!==lowp.id).sort((x,y)=>{const ox=a.per.find(p=>p.id===S.assignments[x]),oy=a.per.find(p=>p.id===S.assignments[y]);return oy.imp-ox.imp||oy.load-ox.load})[0];return {task:tk,to:lowp.id}
}
function moveReady(){const o=S.pick!==null?ROUNDS[S.round].options[S.pick]:null;if(!o||!o.move)return true;return !!(S.move&&S.move.task!=null&&S.move.to!=null&&S.assignments[S.move.task]!==S.move.to)}
function assignWithMove(){const o=S.pick!==null?ROUNDS[S.round].options[S.pick]:null;if(o&&o.move&&moveReady()){const a=[...S.assignments];a[S.move.task]=S.move.to;return a}return S.assignments}

// ───────── 결정 확정 ─────────
function commitRound(){
 const round=S.round,r=ROUNDS[round],o=r.options[S.pick],ivs=S.ivs.map(x=>({...x})),evs=roundEvents(round);
 let moved=null;
 if(o.move&&moveReady()){moved={task:S.move.task,from:S.assignments[S.move.task],to:S.move.to};S.assignments[S.move.task]=S.move.to}
 const aiBefore=Object.fromEntries(roster().map(p=>[p.id,effective(p)[0]]));
 S.shared=clamp(S.shared+o.share);S.backup=clamp(S.backup+o.backup);S.helpMode=o.mode;
 evs.forEach(e=>{if(e.shared)S.shared=clamp(S.shared+e.shared)});

 return `<svg class="portrait" viewBox="0 0 180 180" role="img" aria-label="${PEOPLE[id].n} 캐릭터"><rect width="180" height="180" rx="20" fill="#e8eee5"/><circle cx="143" cy="25" r="48" fill="${c}" opacity=".12"/>${female?`<path d="${id%4===1?'M46 129V56q0-38 44-38t44 38v73z':'M44 111l6-62q3-32 40-32t40 32l6 62-23 14H67z'}" fill="#283e44"/>`:''}<path d="M22 180v-24q5-39 47-43h42q40 4 47 43v24" fill="${c}"/><path d="M68 115l22 27 22-27-10-14H78z" fill="#e5b99b"/><path d="M68 116l22 26-14 18-17-40M112 116l-22 26 14 18 17-40" fill="#fff" opacity=".9"/><rect x="55" y="39" width="70" height="77" rx="32" fill="#edc6aa"/><path d="${female?'M50 78V51q0-34 40-33 43 1 41 38l-7 30-7-39q-23 10-43-7L59 80z':hair===0?'M52 73V49q4-34 40-30 40 0 38 36l-6 24-8-35q-26 13-55 9z':hair===1?'M51 72V45q14-32 51-22 32 12 27 49l-14-26q-20 2-38-7l-14 36z':'M52 69q-7-48 34-48 43-6 45 42l-15-14q-39 8-55-3l-3 25z'}" fill="#283e44"/><path d="M77 91q13 9 26 0" fill="none" stroke="#9e6957" stroke-width="2.5" stroke-linecap="round"/><circle cx="75" cy="74" r="2.3" fill="#283e44"/><circle cx="105" cy="74" r="2.3" fill="#283e44"/>${glasses?'<g fill="none" stroke="#283e44" stroke-width="2"><rect x="62" y="65" width="25" height="19" rx="6"/><rect x="93" y="65" width="25" height="19" rx="6"/><path d="M87 71h6"/></g>':''}<rect x="119" y="143" width="19" height="25" rx="3" fill="#fff" opacity=".8"/><path d="M123 151h11m-11 5h7" stroke="${c}" stroke-width="2"/></svg>`}
function face(id,cls=''){return `<span class="face ${cls}">${portrait(id)}</span>`}
function serviceIcon(type){const inner=type===0?'<rect x="16" y="20" width="48" height="40" rx="9"/><path d="M40 20V10m-9 27h1m16 0h1M28 48h24M16 31H8m56 0h8"/>':type===1?'<rect x="22" y="10" width="36" height="60" rx="8"/><path d="M32 22h16M34 58h12m-6-27v13m0 6v1"/>':'<circle cx="40" cy="27" r="12"/><path d="M16 67v-6q0-20 24-20t24 20v6M18 28q0-24 22-24t22 24M15 28v16h8V28zm42 0v16h8V28zM57 44l-8 7h-9"/>';return `<svg class="mini-icon" viewBox="0 0 80 80" fill="none" stroke="#d5ec8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`}
function deltaChip(d){const x=r1(d);return `<span class="delta ${x<0?'neg':x===0?'zero':''}">${x>0?'+':''}${x}</span>`}
function showModal(html){const d=document.getElementById('modal');d.innerHTML=`<div class="dialoghead"><span class="eyebrow" style="margin:0">GOOD INSIGHT · AX TF LAB</span><button class="small" data-action="close">닫기 ×</button></div>${html}`;if(!d.open)d.showModal()}
let timer={end:null,int:null};
function tickTimer(){const el=document.getElementById('timer');if(!timer.end){el.classList.add('hide');return}const s=Math.round((timer.end-Date.now())/1000),a=Math.abs(s);el.classList.remove('hide');el.classList.toggle('over',s<0);el.textContent=(s<0?'+':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0');if(s===0)toast('토의 시간이 끝났습니다.')}
let memoryRanks=[];
function ranks(){try{const a=JSON.parse(localStorage.getItem(RANKKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function allRanks(){return [...new Map([...ranks(),...memoryRanks].map(r=>[r.id,r])).values()]}
function recordResult(r){const a=allRanks().filter(x=>x.id!==r.id);a.push(r);memoryRanks=a;try{localStorage.setItem(RANKKEY,JSON.stringify(a))}catch(e){storageOK=false}}

// ───────── 작은 부품 ─────────
function ring(load){const C=2*Math.PI*20,pct=Math.min(1,load/9),col={ok:'#0a8070',warn:'#b9850c',over:'#bf3b28'}[loadLv(load)],cap=CAP/9*2*Math.PI-Math.PI/2;return `<svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="20" fill="none" stroke="#e3e7e0" stroke-width="4"/><circle cx="23" cy="23" r="20" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${pct*C} ${C}" transform="rotate(-90 23 23)"/><circle cx="${23+Math.cos(cap)*20}" cy="${23+Math.sin(cap)*20}" r="2.2" fill="#10262e"/></svg>`}
function loadBadge(l){return `<span class="st st-${loadLv(l)}" title="업무 부담 ${r1(l)} / 기준 ${CAP}">${loadLv(l)==='over'?'⚠ ':''}${loadWord(l)}${showNums()?' '+r1(l):''}</span>`}
function aiBadge(a){return `<span class="st st-ai" title="AI 활용 ${r1(a)} / 10">AI ${aiWord(a)}${showNums()?' '+r1(a):''}</span>`}
function bars(v){return `<div class="mbars">${AX.map((n,i)=>`<div><span>${n}</span><i><b style="width:${v[i]*10}%"></b></i></div>`).join('')}</div>`}
function strengths(v){return [...v.map((x,i)=>[x,i])].sort((a,b)=>b[0]-a[0]).slice(0,2).map(([,i])=>`<span class="pill">${AX[i]}</span>`).join('')}
function todo(items){const next=items.findIndex(x=>!x.done&&!x.optional);return `<div class="todo" role="status"><span class="todo-h">지금 할 일</span>${items.map((x,i)=>`<span class="todo-i ${x.done?'done':''} ${i===next?'now':''} ${x.optional&&!x.done?'opt':''}"><b>${x.done?'✓':i+1}</b>${x.label}${x.optional?' <small>(선택)</small>':''}</span>`).join('')}</div>`}
function alertBox(list,title='먼저 확인하세요'){if(!list.length)return '';return `<div class="alertbox"><b class="alert-h">⚠ ${title}</b><ul>${list.map(x=>`<li class="${x.lv||''}">${x.t}</li>`).join('')}</ul></div>`}
function more(title,body,open=false){return `<details class="more"${open?' open':''}><summary>${title}</summary><div class="more-b">${body}</div></details>`}

function shell(body){return `<div class="topline"><div class="steps">${S.stage>0?modePill():''}${STEPS.map((n,i)=>`<span class="step ${S.stage===i?'active':S.stage>i?'done':''}">${i+1}. ${n}</span>`).join('')}</div><span class="tiny muted">${S.name?esc(S.name)+' · ':''}${storageOK?'자동 저장':'자동 저장 불가'}</span></div><div class="fade-in">${body}</div>`}

// ───────── 0. 미션 ─────────
function mission(){return `<section class="panel navy hero"><div class="tag">MISSION</div><h1 style="max-width:900px;margin-top:14px">AI가 먼저 응대했습니다.<br><b>고객은 더 화가 났습니다.</b></h1><div class="crisis"><div>${serviceIcon(0)}<b>엉뚱한 답변</b></div><div>${serviceIcon(1)}<b>단호한 거절</b></div><div>${serviceIcon(2)}<b>지친 상담사</b></div></div><p class="mission-call" style="color:#fff;margin:0">180일 안에, <span style="color:var(--lime)">AI와 사람의 역할을 다시 나누는 운영안</span>을 만드세요.</p></section>
<div class="grid two spacing"><section class="panel"><div class="eyebrow">이 게임에서 보는 것</div><p style="font-size:17px;margin:0 0 14px"><b>운영안만이 아닙니다.</b> AI 실력이 서로 다른 팀원들이 <b>함께 일하고, 성장하고, 지치지 않게</b> 이끈 리더십을 봅니다.</p><div class="flow"><div><b>1</b>리더 유형</div><div><b>2</b>팀원 4명</div><div><b>3</b>업무 나누기</div><div><b>4</b>7라운드</div><div><b>5</b>리포트</div></div></section>
<section class="panel tint"><div class="pc-k" style="width:auto;margin-bottom:8px">진행 방식</div><div class="modepick"><button class="${isSolo()?'on':''}" data-action="mode" data-id="solo" aria-pressed="${isSolo()}"><b>개인전</b><span>각자 혼자 판단해봅니다</span></button><button class="${!isSolo()?'on':''}" data-action="mode" data-id="team" aria-pressed="${!isSolo()}"><b>팀전</b><span>팀이 토의하며 함께 정합니다</span></button></div><label class="spacing-s">교육 회차<input id="sessionname" type="text" maxlength="80" placeholder="진행자가 안내한 회차명" value="${esc(S.session||'')}"></label><p class="tiny muted">완료 시 회차·이름·점수·선택 기록이 진행자에게 제출됩니다. 실명 대신 지정 별칭을 사용할 수 있습니다.</p><label class="spacing-s">${isSolo()?'이름 (또는 조·번호)':'팀 이름'}<input id="teamname" type="text" maxlength="40" placeholder="${isSolo()?'예: 3조 홍길동':'예: 3조 고객경험팀'}" value="${esc(S.name)}"></label><div class="actions"><button class="primary big" data-action="start">시작하기 →</button></div><p class="tiny muted" style="margin:10px 0 0">가상 기관·가상 인물입니다. 실제 인사평가 도구가 아닙니다.</p></section></div>`}

// ───────── 1. 리더 유형 ─────────
function leaderView(){return `${todo([{label:'리더 유형 하나 고르기',done:!!S.leaderType}])}<h1>나는 어떤 리더로 시작할까요?</h1><p class="intro">강점이 있으면 빈틈도 있습니다. 내 빈틈을 채워줄 팀원을 다음 단계에서 고르게 됩니다.</p>
<div class="grid three">${Object.entries(LEADERS).map(([k,L])=>`<button class="ltype ${S.leaderType===k?'selected':''}" data-action="leader" data-id="${k}" aria-pressed="${S.leaderType===k}"><span class="lt-ico">${L.ico}</span><h2>${L.n}</h2><span class="lt-tag">${L.tag}</span><div class="lt-row good"><b>강점</b>${L.strong}</div><div class="lt-row weak"><b>빈틈</b>${L.weak}</div>${bars(L.v)}</button>`).join('')}</div>
<div class="actions"><button data-action="back">이전</button><button class="primary big" data-action="to-team" ${S.leaderType?'':'disabled'}>팀원 만나러 가기 →</button></div>`}

// ───────── 2. 팀원 선발 ─────────
function candCard(id){const p=PEOPLE[id],yes=S.team.includes(id),full=!yes&&S.team.length>=4;return `<article class="cand ${yes?'picked':''}"><div class="cand-top">${portrait(id)}<div><h3>${p.n}</h3><span class="tiny muted">${p.role}</span><div class="cand-badges">${aiBadge(p.v[0])}${strengths(p.v)}</div></div></div><p class="cand-line">${p.line}</p><div class="rumor"><b>미확인 평판</b>${p.rumor}</div><div class="clue"><b>숨은 가능성?</b>${p.clue}</div><button class="${yes?'dark':'primary'} cand-btn" data-action="select-person" data-id="${id}" ${full?'disabled':''}>${yes?'✓ 선발됨 (해제)':full?'4명 선발 완료':'이 사람 선발'}</button></article>`}
function teamView(){const n=S.team.length;return `${todo([{label:`팀원 4명 고르기 (${n}/4)`,done:n===4},{label:'팀으로 출범',done:false}])}<h1>함께할 팀원 4명을 고르세요</h1><p class="intro"><b class="hl">평판은 확인된 사실이 아닙니다.</b> 경력과 숨은 가능성을 함께 보세요.</p>
<div class="selected-tray"><div class="row nowrap"><div class="tray-faces">${face(-1)}<span class="muted">+</span>${[0,1,2,3].map(i=>S.team[i]!==undefined?face(S.team[i]):'<span class="face empty"></span>').join('')}</div><strong>${n} / 4</strong></div><button class="primary" data-action="launch" ${n!==4?'disabled':''}>이 팀으로 출범 →</button></div>
<div class="candgrid">${CANDIDATES.map(candCard).join('')}</div><div class="actions"><button data-action="back">리더 유형 다시 고르기</button></div>`}

// ───────── 3a. 업무 나누기 ─────────
function assignIssues(assign=S.assignments){if(assign.some(x=>x===null))return [];const L=baseLoads(assign),out=[];const top=[...L].sort((a,b)=>b.load-a.load)[0];if(top.load>=7)out.push({lv:'red',t:`<b>${nameOf(top.id)}</b>에게 일이 몰려 있습니다 (과제 ${TASKS.filter((t,i)=>assign[i]===top.id).length}개).`});L.filter(p=>p.id!==-1&&p.imp===0).forEach(p=>out.push({lv:'amber',t:`<b>${p.n}</b>은(는) 중요 과제가 없습니다. 성장 기회가 없을 수 있습니다.`}));const ai=TASKS.map((t,i)=>i).filter(i=>TASKS[i].ai>=.6);const aiOwners=new Set(ai.map(i=>assign[i]));if(aiOwners.size<=2)out.push({lv:'amber',t:`AI를 많이 쓰는 과제 ${ai.length}개가 <b>${[...aiOwners].map(nameOf).join(', ')}</b>에게만 있습니다.`});return out}
function assignView(){const ppl=roster(),L=baseLoads(),editing=!!S.initialAssignments,filled=S.assignments.filter(x=>x!==null).length,base=editing?S.assignBackup:null,changed=editing&&base?S.assignments.filter((id,i)=>id!==base[i]).length:0;
 return `${editing?todo([{label:'바꿀 과제 고치기',done:changed>0},{label:'변경 적용',done:false}]):todo([{label:`10개 과제 담당 정하기 (${filled}/10)`,done:filled===NT},{label:'확정',done:false}])}<h1>${editing?'업무를 다시 나눠볼까요?':'누구에게 어떤 일을 맡길까요?'}</h1><p class="intro">${editing&&S.history.length?'<b class="hl">담당이 바뀐 과제는 이번 라운드에 인수인계 비용이 생깁니다.</b> 꼭 필요한 곳만 바꾸세요.':editing?'아직 시작 전이라 바꿔도 인수인계 비용은 없습니다.':'과제마다 담당을 한 명씩 고르세요. 리더도 맡을 수 있지만, 그만큼 리더가 바빠집니다.'}</p>
<p class="pc-hint">💡 <b>이름 위에 마우스를 올리면</b> 그 사람의 강점과 이 과제와의 궁합이 보입니다.</p>${alertBox(assignIssues())}
<div class="worklayout"><section class="panel" style="padding:10px 16px"><div class="arow ahead"><span>과제</span><span>담당</span></div>${TASKS.map((t,i)=>{const cur=S.assignments[i];return `<div class="arow ${cur===null?'unset':''} ${base&&cur!==base[i]?'changed':''}"><div><span class="kind k-${t.kind}">${t.kind}</span><b>${t.n}</b><small>${t.axes.map(a=>AX[a]).join(' · ')}${t.ai>=.6?' · AI 많이 씀':''}${base&&cur!==base[i]?` · <em class="moved">${nameOf(base[i])} → ${nameOf(cur)}</em>`:''}</small></div><div class="chips">${ppl.map(p=>`<button class="chip ${cur===p.id?'on':''}" data-action="assign" data-task="${i}" data-id="${p.id}" data-pid="${p.id}" data-ptask="${i}" aria-pressed="${cur===p.id}">${face(p.id)}<span>${p.id===-1?'리더':p.n}</span></button>`).join('')}</div></div>`}).join('')}</section>
<aside class="sidebar"><div class="panel" style="padding:16px"><h3>한 사람당 일의 양</h3>${L.map(p=>`<div class="loadrow ${p.load>=7?'over':''}" data-pid="${p.id}" tabindex="0">${face(p.id)}<span>${p.id===-1?'리더(나)':p.n}</span><i><b style="width:${Math.min(100,p.load/10*100)}%"></b></i><span class="tiny">${p.imp?'중요 '+p.imp:'<em>중요 0</em>'}</span></div>`).join('')}<div class="actions" style="margin-top:12px">${editing?`<button class="small" data-action="cancel-work">취소</button><button class="primary" data-action="confirm-work" ${assignValid()?'':'disabled'}>변경 적용${changed?` (${changed}건)`:''}</button>`:`<button class="primary" data-action="confirm-work" ${assignValid()?'':'disabled'}>확정 →</button>`}</div>${!editing&&filled<NT?`<p class="need">↑ 아직 담당이 없는 과제 ${NT-filled}개</p>`:''}</div></aside></div>`}
// ───────── 3b. 킥오프 ─────────
function kickoffView(){return `${todo([{label:'리더의 첫 메시지 쓰기',done:!!(S.kickMsg||'').trim(),optional:true},{label:'첫 결정으로',done:false}])}<h1>오늘부터 한 팀입니다</h1><div class="kickrow">${S.team.map(id=>`<div class="kick" data-pid="${id}" tabindex="0">${portrait(id)}<b>${PEOPLE[id].n}</b><span>“${PEOPLE[id].quote}”</span></div>`).join('')}</div>
<section class="panel tint spacing"><label>리더의 첫 메시지 <span class="muted">(최종 리포트에서 다시 보여드립니다)</span><textarea id="kickmsg" rows="2" maxlength="160" placeholder="예: 고객도, 우리도 덜 지치는 방법을 같이 찾읍시다.">${esc(S.kickMsg||'')}</textarea></label></section>
<div class="actions"><button data-action="edit-work">업무 다시 보기</button><button class="primary big" data-action="kickoff-next">첫 결정으로 →</button></div>`}

// ───────── 3c. 라운드 ─────────
function speakerFor(r){
 const t=S.team.map(person),ai=p=>effective(p)[0];
 const by=(f,desc=true)=>[...t].sort((a,b)=>desc?f(b)-f(a):f(a)-f(b));
 switch(r.speaker){case'lowComm':return by(p=>effective(p)[2],false)[0];case'topAI':return by(ai)[0];case'lowAI':return by(ai,false)[0];case'midAI':return by(ai)[1];
 case'mostRoutine':{const topId=by(ai)[0].id;return by(p=>(p.id===topId?-99:0)+sum(TASKS.map((x,i)=>S.assignments[i]===p.id?(x.kind==='반복'?x.load:x.kind==='중요'?-3:0):0)))[0]}case'lowGrowth':return by(p=>ai(p)-p.v[0],false)[0];default:return t[0]}}
function eventCard(e){return `<div class="eventcard ${e.kind}"><span class="ico">${e.kind==='info'?'i':'!'}</span><div><b>${e.kind==='fac'?'돌발 · ':e.kind==='info'?'':'이번 라운드 변수 · '}${e.title}</b><p>${e.desc}</p></div></div>`}
function situation(r){const sp=speakerFor(r),evs=roundEvents();return `<section class="situation" data-day="D+${r.d}"><div><div class="tag">ROUND ${S.round+1} / 7 · ${r.day}</div><div class="roundstrip" style="margin-top:10px">${ROUNDS.map((_,i)=>`<span class="${i<S.round?'done':i===S.round?'active':''}"></span>`).join('')}</div><h1>${r.title}</h1><p class="problem">${r.problem}</p></div><div class="speaker">${portrait(sp.id)}<div class="speech">“${r.voice}”<small>${sp.n}</small></div></div>${evs.length?`<div class="events">${evs.map(eventCard).join('')}</div>`:''}</section>`}
function hud(a,label){return `<div class="hud" aria-label="팀 상태"><span class="hud-label">${label}</span>${a.per.map(p=>`<button class="hud-p ${loadLv(p.load)==='over'?'is-over':''}" data-action="person" data-id="${p.id}" data-pid="${p.id}"><span class="ringwrap">${ring(p.load)}${portrait(p.id)}</span><span><b>${p.id===-1?'리더(나)':p.n}${p.absent?' · 공백':''}</b>${loadBadge(p.load)}</span></button>`).join('')}</div>`}
function moveBox(o){const opt=(sel,list)=>list.map(([v,t])=>`<option value="${v}" ${sel===v?'selected':''}>${t}</option>`).join('');return `<div class="movebox"><b>⇄ 실제로 일을 옮겨야 합니다</b><div class="row spacing-s"><label class="tiny">옮길 과제<select id="mv-task">${opt(S.move.task,TASKS.map((t,i)=>[i,`${t.n} (지금: ${nameOf(S.assignments[i])})`]))}</select></label><span class="mv-arrow">→</span><label class="tiny">새 담당<select id="mv-to">${opt(S.move.to,[-1,...S.team].map(id=>[id,nameOf(id)]))}</select></label></div>${!moveReady()?'<p class="need" style="margin:8px 0 0">지금 담당과 다른 사람을 고르세요</p>':''}</div>`}
function ivPanel(){const used=ivCost(),total=leaderTime(),left=total-used,team=S.team.map(person);const opts=list=>list.map(p=>`<option value="${p.id}">${nameOf(p.id)}</option>`).join('');return `<div class="stephead"><span class="stepno">2</span><h2>리더가 직접 쓸 시간 <span class="muted" style="font-size:15px;font-weight:600">(선택)</span></h2><span class="sub budget">남은 시간 <span class="pips">${Array.from({length:total},(_,i)=>`<i class="${i<left?'':'off'}"></i>`).join('')}</span> ${left}/${total}</span></div><div class="ivrow">${Object.entries(IV).map(([k,d])=>{const dis=d.cost>left;return `<div class="iv"><div class="row between nowrap"><h4>${d.n}</h4><span class="tiny muted">${d.cost}시간</span></div><p>${d.desc}</p>${d.targets.map((tg,j)=>`<label class="tiny">${tg}<select id="iv-${k}-${j}">${opts(k==='pair'&&j===0?[person(-1),...team]:team)}</select></label>`).join('')}<button class="small ${dis?'':'dark'}" data-action="add-iv" data-type="${k}" ${dis?'disabled':''}>추가</button></div>`}).join('')}</div>${S.ivs.length?`<div class="chosen-ivs">${S.ivs.map((iv,j)=>`<span>${IV[iv.type].n} · ${nameOf(iv.a)}${iv.b!==undefined?' → '+nameOf(iv.b):''}<button data-action="del-iv" data-id="${j}" aria-label="취소">×</button></span>`).join('')}</div>`:''}<p class="tiny muted spacing-s">개입할수록 리더도 바빠집니다. 리더가 과부하면 운영안 진척이 줄어듭니다.</p>`}
function decisionView(r){const o=S.pick!==null?r.options[S.pick]:null,preview=assess(o,S.ivs,S.round,assignWithMove());const over=preview.per.filter(p=>p.load>CAP);
 return `${todo([{label:'상황 읽기',done:true},{label:'운영 방식 고르기',done:S.pick!==null},...(o&&o.move?[{label:'옮길 일 정하기',done:moveReady()}]:[]),{label:'리더 시간 쓰기',done:S.ivs.length>0,optional:true},{label:'결정 확정',done:false}])}<div class="round-revisit"><h2>ROUND ${S.round+1} · ${r.title}</h2><button class="small" data-action="episode-revisit">상황 다시 보기</button></div>${roundEvents().length?`<section class="situation" style="display:block;padding:18px"><div class="events">${roundEvents().map(eventCard).join('')}</div></section>`:''}
${hud(preview,o||S.ivs.length?'선택하면<br>이렇게 됩니다':'지금<br>팀 상태')}
${over.length?alertBox([{lv:'red',t:`<b>${over.map(p=>p.n).join(', ')}</b> — 이대로면 과부하입니다.`}],'과부하 경고'):''}
<div class="reassign"><span>배정을 바꾸고 싶나요? <small>바뀐 과제는 이번 라운드에 인수인계 비용이 생깁니다.</small></span><button data-action="edit-work">⇄ 업무 다시 나누기</button></div>

${o&&o.move?moveBox(o):''}
${ivPanel()}
${more('판단 근거 메모 (선택)',`<textarea id="reason" rows="3" maxlength="300" placeholder="무엇을 포기하고 무엇을 지키기로 했나요?">${esc(S.note)}</textarea>`,!!S.note)}
<div class="commitbar"><span class="${S.pick!==null&&moveReady()?'ready':'need'}">${S.pick===null?'← 먼저 운영 방식(A·B·C)을 고르세요':!moveReady()?'← 옮길 일을 정하세요':'✓ 준비 완료 — 확정하세요'}</span><button class="primary big" data-action="commit" ${S.pick===null||!moveReady()?'disabled':''}>결정 확정 → 결과 보기</button></div>`}

function episodePending(){return S.stage===3&&!S.feedback&&S.assignDone&&!S.assignEditing&&(S.round>0||S.kickoffDone)&&!wsPractice&&!rgPractice&&!wsInWorkshop()&&!rgActive()&&!(S.episodeSeen||[]).includes(S.round)}
function episodeView(){
 const ep=EPISODES[S.round],sp=speakerFor(ROUNDS[S.round]);
 const others=S.team.map(person).filter(p=>p.id!==sp.id);
 const high=[...S.team.map(person)].sort((a,b)=>effective(b)[0]-effective(a)[0])[0];
 let actors=[others[0],others[1],sp];
 if(S.round===2||S.round===5)actors=[high,...S.team.map(person).filter(p=>p.id!==high.id).slice(0,2)];
 const glyphs={meeting:['✦','▤','▱'],requests:['↗','↗','◷'],handoff:['▤','→','?'],evidence:['▥','?','◷'],recognition:['★','▤','↔'],absence:['◷','▤','?'],finish:['▥','▤','→']}[ep.scene];
 return `<section class="episode episode-${ep.scene}" aria-labelledby="ep-title"><div class="ep-heading"><span class="ep-number">EPISODE ${String(S.round+1).padStart(2,'0')}</span><h1 id="ep-title" tabindex="-1">${ep.title}</h1><p>${ep.context}</p></div><div class="ep-stage">${actors.map((p,i)=>`<article class="ep-person ep-person-${i}"><div class="ep-prop"><span class="ep-glyph" aria-hidden="true">${glyphs[i]}</span><b>${ep.props[i]}</b><div class="ep-paper" aria-hidden="true"><i></i><i></i><i></i></div></div><div class="ep-character">${portrait(p.id)}<span>${esc(p.n)}</span></div><p class="ep-quote">“${ep.lines[i]}”</p></article>`).join('')}</div><div class="ep-bottom"><button class="primary big" data-action="episode-enter">결정하러 가기 <span aria-hidden="true">→</span></button></div></section>`;
}

function roundView(){if(!S.assignDone||S.assignEditing)return assignView();if(S.round===0&&!S.kickoffDone)return kickoffView();if(episodePending())return episodeView();const r=ROUNDS[S.round];return decisionView(r)}

function mcTierMsg(tier,mode){if(mode==='team')return {best:'작전이 통했습니다! 나눠서 기억한 힘이 그대로 드러났습니다.',good:'함께 보니 확실히 빨랐습니다. 작전을 조금만 다듬으면 최우수도 가능합니다.',done:'모든 짝을 찾았습니다! 다음엔 누가 어느 구역을 볼지 더 분명히 나눠보세요.'}[tier];return {best:'혼자서도 대단한 기억력입니다!',good:'좋은 기록입니다. 팀전에서는 이 기억을 나눠 가져보세요.',done:'모든 짝을 찾았습니다! 팀전에서는 혼자 다 외울 필요가 없습니다.'}[tier]}

let WS=null;

function mcFmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function mcIcon(k){const ic=MC_ICONS.find(x=>x.k===k);return `<svg viewBox="0 0 64 64" fill="none" stroke="${ic.c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic.d}</svg>`}
function mcShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mcDeck(cfg){const n=cfg.rows*cfg.cols-(cfg.fixed!=null?1:0);const icons=mcShuffle([...MC_ICONS]).slice(0,n/2);const d=mcShuffle([...icons,...icons].map(x=>({k:x.k,open:false,matched:false})));if(cfg.fixed!=null)d.splice(cfg.fixed,0,{fixed:true});return d}
function mcInit(people,prefer){mcStop();WS={stage:'intro',people:people||5,prefer:prefer||'team'}}
function mcStop(){if(!WS)return;clearInterval(WS.cd);clearInterval(WS.tick);clearInterval(WS.planT)}
function mcPairs(){return WS.deck.filter(c=>!c.fixed).length/2}
function mcFound(){return WS.deck.filter(c=>c.matched).length/2}
function mcGame(cfg,pv){mcStop();Object.assign(WS,{rows:cfg.rows,cols:cfg.cols,deck:mcDeck(cfg),first:null,lock:true,attempts:0,turn:0,secs:0,phase:'preview',pv});WS.deck.forEach(c=>{if(!c.fixed)c.open=true});mcRender();mcTop();let n=pv;WS.cd=setInterval(()=>{n--;const el=document.getElementById('mc-count');if(n>0){if(el)el.textContent=n}else{clearInterval(WS.cd);WS.deck.forEach(c=>c.open=false);WS.phase='play';WS.lock=false;WS.t0=Date.now();mcRender();WS.tick=setInterval(()=>{WS.secs=Math.round((Date.now()-WS.t0)/1000);const t=document.getElementById('mc-time');if(t)t.textContent=mcFmt(WS.secs)},1000)}},1000)}
function mcStartWarm(){WS.stage='warm';WS.mode=null;mcGame(MC.warm,MC.warm.preview)}
function mcStartSolo(){mcStop();WS.stage='main';WS.mode='solo';mcGame(MC.solo,mcPreview())}
function mcStartPlan(){mcStop();WS.stage='plan';WS.mode='team';WS.planLeft=MC.plan;mcRender();mcTop();WS.planT=setInterval(()=>{WS.planLeft--;const el=document.getElementById('mc-plan');if(el)el.textContent=WS.planLeft;if(WS.planLeft<=10&&el)el.classList.add('hurry');if(WS.planLeft<=0)mcStartMain()},1000)}
function mcStartMain(){clearInterval(WS.planT);WS.stage='main';WS.mode='team';mcGame(MC.team,mcPreview())}
function mcSync(){const cards=document.querySelectorAll('#mc-board .wcard');WS.deck.forEach((c,i)=>{const el=cards[i];if(!el||c.fixed)return;el.classList.toggle('open',c.open||c.matched);el.classList.toggle('matched',c.matched)});const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};set('mc-turn',(WS.turn%WS.people)+1+'번 손가락');set('mc-tries',WS.attempts+'회');set('mc-pairs',mcFound()+' / '+mcPairs())}
function mcFlip(i){if(!WS||WS.phase!=='play'||WS.lock)return;const c=WS.deck[i];if(!c||c.fixed||c.open||c.matched)return;c.open=true;
 if(WS.first===null){WS.first=i;mcSync();return}
 const a=WS.deck[WS.first];WS.attempts++;
 if(a.k===c.k){a.matched=c.matched=true;a.open=c.open=false;WS.first=null;WS.turn++;mcSync();const el=document.querySelectorAll('#mc-board .wcard')[i];if(el)el.classList.add('pop');if(WS.deck.every(x=>x.fixed||x.matched)){WS.lock=true;setTimeout(mcDone,700)}}
 else{WS.lock=true;mcSync();const f=WS.first;setTimeout(()=>{WS.deck[f].open=false;c.open=false;WS.first=null;WS.lock=false;WS.turn++;mcSync()},950)}}
function mcDone(){mcStop();WS.secs=Math.round((Date.now()-WS.t0)/1000);if(WS.stage==='warm'){WS.warm={a:WS.attempts,s:WS.secs};WS.stage='warmdone';mcRender();mcTop()}else{WS.stage='done';WS.result={a:WS.attempts,s:WS.secs,mode:WS.mode,tier:mcTier(WS.attempts,WS.mode)};mcOnFinish(WS.result)}}

function mcPlayView(label){const main=WS.stage==='main',team=main&&WS.mode==='team',t=main?mcCfg().tiers:null;const bar=WS.phase==='preview'?`<div class="wsbar pvbar"><span>${team?'작전대로 맡은 구역을':'카드 위치를'} 지금 외우세요!</span><b id="mc-count" class="pvnum">${WS.pv}</b><span>초</span></div>`:null;return `<div class="eyebrow">${label}</div>${bar||`<div class="wsbar">${team?`<div><span class="tiny muted">이번 차례</span><b id="mc-turn" class="lv-ok">${(WS.turn%WS.people)+1}번 손가락</b></div>`:`<div><span class="tiny muted">모드</span><b>${main?'개인전':'몸풀기'}</b></div>`}<div><span class="tiny muted">시도</span><b id="mc-tries">${WS.attempts}회</b></div><div><span class="tiny muted">찾은 짝</span><b id="mc-pairs">${mcFound()} / ${mcPairs()}</b></div><div><span class="tiny muted">시간</span><b id="mc-time">${mcFmt(WS.secs||0)}</b></div><div class="wsgoal"><span class="tiny muted">${main?'목표':'몸풀기'}</span><b>${main?`우수 ${t.good} · 최우수 ${t.best}회`:'연습 · 기록만'}</b></div></div>`}<div class="mcwrap ${WS.cols>5?'wide':WS.cols>3?'mid':''}" id="mc-board">${mcBoardHtml()}</div><p class="center tiny muted spacing-s">${WS.phase==='preview'?(team?'지금! 작전대로 맡은 구역을 외우세요.':'지금 기억하세요!'):team?'좌표로 말하면 빠릅니다. “C5에 헤드셋!”':'기억을 믿고 뒤집어보세요.'}</p>`}

${canChoose?`<div class="stephead"><span class="stepno">★</span><h2>리더 보상을 하나 고르세요</h2></div><p class="muted">지금 리더 상태 ${loadBadge(S.history.at(-1).per.find(p=>p.id===-1).load)} · 정답은 없습니다. 리더 상태를 보고 고르세요.</p><div class="grid two">${Object.entries(WS_REWARD).map(([k,r])=>`<button class="choice" data-action="ws-choose" data-id="${k}"><span class="letter" style="font-size:20px">${r.ico}</span><h3>${r.n}</h3><p>${r.desc}</p></button>`).join('')}</div>`:''}
${!wsPractice&&w.choice?`<div class="note spacing-s">선택한 리더 보상 · ${WS_REWARD[w.choice].ico} ${WS_REWARD[w.choice].n}</div>`:''}
<section class="lesson spacing"><div class="lesson-k">1분 나눔</div><p class="lesson-t" style="font-size:21px">${team?'작전대로 됐나요? 맡은 구역을 기억한 사람이 차례가 아닐 때, 팀은 그 기억을 어떻게 썼나요?':'혼자 20장을 기억해보니 어땠나요? 팀이었다면 무엇을 나눠 맡았을까요?'}</p><div class="lesson-q"><b>6라운드 예고</b>${team?'나눠서 기억하면 더 많이 남지만, 그 구역을 맡은 사람이 빠지면 그 기억도 함께 빠집니다.':'혼자 다 기억하는 사람이 있으면 편하지만, 그 사람이 빠지면 팀은 멈춥니다.'}</div></section>
<div class="actions">${wsPractice?'<button class="primary big" data-action="ws-exit">체험 종료 → 원래 화면</button>':`<button class="primary big" data-action="ws-continue" ${canChoose?'disabled':''}>다음 라운드 → 3라운드</button>`}</div>`}
function wsApply(attempts,secs,mode){mode=mode||S.mode||'team';const tier=attempts==null?'done':mcTier(attempts,mode);S.workshop=Object.assign(S.workshop||{},{attempts,secs,mode,tier,choice:null,done:false});roster().forEach(p=>{S.fatigue[p.id]=Math.max(0,(S.fatigue[p.id]||0)-2)});save()}
function wsChoose(k){if(!S.workshop||S.workshop.choice||S.workshop.tier==='done')return;S.workshop.choice=k;if(k==='time')S.bonusTime=S.round+1;if(k==='rest'){S.fatigue[-1]=Math.max(0,(S.fatigue[-1]||0)-4);S.leaderRest=S.round+1}}

// ───────── 골인 챌린지 (5라운드 뒤 · 공 굴리기 퍼즐) ─────────
// 규칙: ① 아래가 비면 떨어진다 ② 바닥이 있으면 가던 방향으로 ③ 경사판 위에서 내리막 쪽으로 ④ 막히면 튕긴다 ⑤ 판 밖으로 떨어지면 실패
const RG_SOLID='#B/\\';
function rgParse(rows){const g=rows.map(r=>r.split(''));let s=null;g.forEach((r,y)=>r.forEach((c,x)=>{if(c==='S'){s={x,y};r[x]='.'}}));return {g,S:s,W:g[0].length,H:g.length}}
function rgRoll(g,s,W,H){let x=s.x,y=s.y,dx=1;const path=[{x,y}],seen=new Set(),solid=c=>RG_SOLID.includes(c);
 for(let i=0;i<400;i++){if(g[y][x]==='G')return {ok:true,path,why:'goal'};const k=x+','+y+','+dx;if(seen.has(k))return {ok:false,path,why:'loop'};seen.add(k);if(y+1>=H)return {ok:false,path,why:'fall'};
  const below=g[y+1][x];if(!solid(below)){y++;path.push({x,y});continue}
  if(below==='/')dx=-1;else if(below==='\\')dx=1;
  let nx=x+dx;if(nx<0||nx>=W||solid(g[y][nx])){dx=-dx;nx=x+dx;if(nx<0||nx>=W||solid(g[y][nx]))return {ok:false,path,why:'stuck'}}x=nx;path.push({x,y})}
 return {ok:false,path,why:'loop'}}
// 정답은 풀이기로 전수 확인: 몸풀기·개인전 정답 1개, 팀전은 사실상 1개(두 블록의 자리만 바꾼 변형 1개)
const RG_LEVELS={
 warm:{label:'몸풀기',size:'6×6',limit:1,tries:3,rows:['S.....','####..','##....','#B#.B.','.G..B/','###.#/'],answer:[[4,3,'B',3,5]],tip:'공이 어디서 멈추는지 먼저 보세요. 상자 하나면 됩니다.'},
 solo:{label:'개인전',size:'8×7',limit:2,tries:2,rows:['S.......','#/#####.','.######.','......B.','/....###','\\G...B..','#B#\\####'],answer:[[1,1,'\\',1,1],[6,3,'B',4,5]],tip:'옮기는 것만 답이 아닙니다. 경사판을 <b>뒤집는</b> 것도 한 번의 손대기입니다.'},
 team:{label:'팀전',size:'8×7',limit:2,tries:1,rows:['S.......','#######\\','........','......./','.......\\','GB..B.\\B','#.####.#'],answer:[[7,1,'/',5,5],[1,5,'B',1,6]],tip:'공이 경사판을 만날 때마다 방향이 바뀝니다. 끝까지 손가락으로 따라가 본 뒤에 굴리세요.'}
};
const RG_TIME={solo:{best:120,good:240},team:{best:180,good:360}};
const RG_PTS={best:1.5,good:1,done:.5,fail:0,skip:0};
const RG_TIER={best:{n:'최우수',s:'★★★'},good:{n:'우수',s:'★★☆'},done:{n:'골인',s:'★☆☆'},fail:{n:'아쉬운 도전',s:'☆☆☆'},skip:{n:'건너뜀',s:'—'}};
const RG_WHY={fall:'아래로 떨어졌습니다',stuck:'꽉 막혀서 멈췄습니다',loop:'같은 자리를 계속 맴돕니다'};
const RG_STEP=120,RG_SCALE_KEY='goodinsight-roll-scale';
function rgScale(){try{const v=+localStorage.getItem(RG_SCALE_KEY);return [1,1.5,2].includes(v)?v:1}catch(e){return 1}}
function rgSetScale(v){try{localStorage.setItem(RG_SCALE_KEY,String(v))}catch(e){}}
function rgLimits(mode){const t=RG_TIME[mode],k=rgScale();return {best:Math.round(t.best*k),good:Math.round(t.good*k)}}
function rgTier(secs,mode){const t=rgLimits(mode);return secs<=t.best?'best':secs<=t.good?'good':'done'}
function rgPts(v){return '+'+(v||0).toFixed(1)+'점'}

let RG=null,rgPractice=false;
function rgActive(){return rgPractice||(S.stage===3&&S.rollgame&&!S.rollgame.done)}
function rgStop(){if(RG)clearInterval(RG.tick)}
function rgReset(){rgStop();RG=null}
function rgInit(){rgStop();RG={stage:'intro',people:Math.min(6,(S.team&&S.team.length||4)+1)}}
function rgLoad(key){rgStop();const L=RG_LEVELS[key],P=rgParse(L.rows),pieces=[];P.g.forEach((r,y)=>r.forEach((c,x)=>{if('B/\\'.includes(c)){pieces.push({x,y,c,ox:x,oy:y,oc:c});r[x]='.'}}));
 Object.assign(RG,{key,L,W:P.W,H:P.H,base:P.g,S:P.S,pieces,sel:null,tries:0,triesMax:L.tries,turn:0,agree:false,trail:[],failAt:null,busy:false,history:[],ballPos:null,res:null,lastWhy:null,secs:0,t0:null,demo:false})}
function rgGrid(){const g=RG.base.map(r=>[...r]);RG.pieces.forEach(p=>g[p.y][p.x]=p.c);return g}
function rgPieceAt(x,y){return RG.pieces.findIndex(p=>p.x===x&&p.y===y)}
function rgChanged(p){return p.x!==p.ox||p.y!==p.oy||p.c!==p.oc}
function rgUsed(){return RG.pieces.filter(rgChanged).length}
function rgTeam(){return RG.key==='team'}
function rgMain(){return RG.stage==='main'||RG.stage==='done'}

// ── 진행 ──
function rgStartWarm(){RG.stage='warm';rgLoad('warm');render();goTop()}
function rgToPick(){rgStop();RG.stage='pick';render();goTop()}
function rgStartMain(mode){RG.stage='main';rgLoad(mode);RG.t0=Date.now();RG.tick=setInterval(rgTick,1000);render();goTop()}
function rgTick(){if(!RG||!RG.t0)return;RG.secs=Math.floor((Date.now()-RG.t0)/1000);const t=document.getElementById('rg-time'),n=document.getElementById('rg-next');if(t)t.textContent=mcFmt(RG.secs);if(n)n.innerHTML=rgNextHtml()}
function rgNextHtml(){const t=rgLimits(RG.key),s=RG.secs;if(s<=t.best)return `★★★ ${rgPts(RG_PTS.best)} <small>${mcFmt(t.best-s)} 남음</small>`;if(s<=t.good)return `★★☆ ${rgPts(RG_PTS.good)} <small>${mcFmt(t.good-s)} 남음</small>`;return `★☆☆ 골인하면 ${rgPts(RG_PTS.done)}`}
function rgDoRoll(){if(!RG||RG.busy||RG.res||RG.stage==='done'||RG.tries>=RG.triesMax)return;if(rgTeam()&&!RG.agree)return;
 RG.busy=true;RG.sel=null;RG.failAt=null;RG.trail=[];RG.tries++;RG.ballPos=RG.S;render();rgAnimate(rgFinish)}
function rgAnimate(done){const r=rgRoll(rgGrid(),RG.S,RG.W,RG.H);let i=0;const path=r.path.slice();if(r.why==='fall'){const l=path[path.length-1];path.push({x:l.x,y:RG.H})}
 const step=()=>{if(!RG)return;if(i>=path.length){done(r);return}const p=path[i++];RG.ballPos=p;rgPlaceBall(p,true);
  if(p.y<RG.H){RG.trail.push(p);const b=document.getElementById('rg-board'),c=b&&b.querySelector(`[data-x="${p.x}"][data-y="${p.y}"]`);if(c&&!c.classList.contains('wall')&&!c.classList.contains('piece'))c.classList.add('trail')}
  setTimeout(step,RG_STEP)};
 setTimeout(step,250)}
function rgFinish(r){RG.busy=false;RG.lastWhy=r.why;const last=r.path[r.path.length-1];
 if(r.ok)RG.res={ok:true};else{RG.failAt=last;RG.agree=false;if(RG.tries>=RG.triesMax)RG.res={ok:false}}
 if(RG.stage==='main'&&RG.res){rgStop();RG.secs=Math.floor((Date.now()-RG.t0)/1000);const tier=RG.res.ok?rgTier(RG.secs,RG.key):'fail';
  RG.result={tier,secs:RG.secs,mode:RG.key,tries:RG.tries,pts:RG_PTS[tier]};RG.stage='done';if(!rgPractice)rgApply(RG.result)}
 render();
 if(RG.res&&RG.res.ok){if(typeof rgConfetti==='function')rgConfetti()}
 else{const b=document.getElementById('rg-board');if(b){b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),500)}}
 if(RG.stage==='done')goTop()}
function rgApply(r){S.rollgame=Object.assign(S.rollgame||{},{tier:r.tier,secs:r.secs,mode:r.mode,tries:r.tries,pts:r.pts,done:false});save()}
function rgSkip(){rgReset();S.rollgame=Object.assign(S.rollgame||{},{tier:'skip',secs:null,mode:S.mode||'team',tries:0,pts:0,done:false});save()}
function rgSnapshot(){RG.history.push(RG.pieces.map(p=>({...p})));if(RG.history.length>30)RG.history.shift()}
function rgAfterMove(){RG.failAt=null;RG.trail=[];RG.ballPos=RG.S;RG.agree=false;RG.turn++;render()}
function rgClick(x,y){if(!RG||!RG.pieces||RG.busy||RG.res||RG.stage==='done')return;const pi=rgPieceAt(x,y);
 if(pi>=0){const p=RG.pieces[pi];if(RG.sel===pi){if(p.c!=='B'){if(!rgChanged(p)&&rgUsed()>=RG.L.limit)return toast(`더 손댈 수 없습니다 (최대 ${RG.L.limit}개). 이미 손댄 블록을 쓰거나 되돌리세요.`);rgSnapshot();p.c=p.c==='/'?'\\':'/';rgAfterMove()}else{RG.sel=null;render()}return}
  RG.sel=pi;render();return}
 if(RG.sel===null)return;
 if(RG.base[y][x]!=='.'||(x===RG.S.x&&y===RG.S.y))return toast('빈칸에만 놓을 수 있습니다.');
 const q=RG.pieces[RG.sel];if(!rgChanged(q)&&rgUsed()>=RG.L.limit)return toast(`더 손댈 수 없습니다 (최대 ${RG.L.limit}개). 이미 손댄 블록을 쓰거나 되돌리세요.`);
 rgSnapshot();q.x=x;q.y=y;RG.sel=null;rgAfterMove()}
function rgUndo(){if(!RG||RG.busy||RG.res||!RG.history.length)return;RG.pieces=RG.history.pop();RG.sel=null;RG.failAt=null;RG.trail=[];RG.agree=false;RG.ballPos=RG.S}
function rgResetBoard(){if(!RG||RG.busy||RG.res||!RG.pieces)return;rgSnapshot();RG.pieces.forEach(p=>{p.x=p.ox;p.y=p.oy;p.c=p.oc});RG.sel=null;rgAfterMove()}
function rgAnswer(){if(RG&&RG.busy)return;const key=RG&&RG.key?RG.key:(S.rollgame&&S.rollgame.mode)||'team';if(!RG)rgInit();if(RG.key!==key){const st=RG.stage;rgLoad(key);RG.stage=st}
 RG.pieces.forEach(p=>{p.x=p.ox;p.y=p.oy;p.c=p.oc});RG.L.answer.forEach(([fx,fy,c,tx,ty])=>{const q=RG.pieces.find(p=>p.ox===fx&&p.oy===fy);q.x=tx;q.y=ty;q.c=c});
 RG.busy=true;RG.sel=null;RG.failAt=null;RG.trail=[];RG.ballPos=RG.S;RG.demo=true;render();rgAnimate(()=>{RG.busy=false;render()})}

// ── 그리기 ──
function rgRamp(c){return c==='/'?'<svg viewBox="0 0 10 10" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,10 10,0 10,10"/></svg>':'<svg viewBox="0 0 10 10" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,0 0,10 10,10"/></svg>'}
function rgCell(x,y){const base=RG.base[y][x],pi=rgPieceAt(x,y),p=pi>=0?RG.pieces[pi]:null,isS=x===RG.S.x&&y===RG.S.y,tr=RG.trail.some(t=>t.x===x&&t.y===y);
 const live=!RG.busy&&!RG.res&&RG.stage!=='done';let cls='rg-cell',inner='',name='빈칸';
 if(base==='#'){cls+=' wall';name='벽'}else if(base==='G'){cls+=' goal';inner='<span class="rg-flag">🏁</span>';name='골인'}
 if(p){cls+=' piece'+(RG.sel===pi?' sel':'')+(rgChanged(p)?' moved':'');inner=p.c==='B'?'<span class="rg-crate"></span>':rgRamp(p.c);name=p.c==='B'?'상자':'경사판'}
 if(isS&&!p){inner+='<span class="rg-start">출발</span>';name='출발'}
 if(tr&&!p&&base!=='#')cls+=' trail';
 if(RG.failAt&&RG.failAt.x===x&&RG.failAt.y===y)cls+=' fail';
 if(live&&RG.sel!==null&&!p&&base==='.'&&!isS)cls+=' drop';
 return `<button class="${cls}" data-action="rg-cell" data-x="${x}" data-y="${y}" ${base==='#'||!live?'tabindex="-1"':''} aria-label="${'ABCDEFGH'[y]}${x+1} ${name}">${inner}</button>`}
function rgBoardHtml(){let h='';for(let y=0;y<RG.H;y++)for(let x=0;x<RG.W;x++)h+=rgCell(x,y);return `<div class="rg-board" id="rg-board" style="grid-template-columns:repeat(${RG.W},1fr);--w:${RG.W};--h:${RG.H}">${h}<span class="rg-ball" id="rg-ball"></span></div>`}
function rgLegend(){return `<div class="rg-legend"><span><i class="rg-lg crate"></i>상자(옮김)</span><span><i class="rg-lg ramp">${rgRamp('/')}</i>경사판(옮기기·뒤집기)</span><span><i class="rg-lg wall"></i>벽(고정)</span><span>🏁 골인</span><span><i class="rg-lg trailc"></i>지난 길</span></div>`}
function rgPlaceBall(p,anim){const ball=document.getElementById('rg-ball'),b=document.getElementById('rg-board');if(!ball||!b||!p)return;const c=b.querySelector(`[data-x="${p.x}"][data-y="${Math.min(p.y,RG.H-1)}"]`);if(!c)return;const w=c.offsetWidth,extra=p.y>=RG.H?w:0;
 ball.style.transition=anim?`transform ${RG_STEP}ms linear`:'none';ball.style.width=ball.style.height=w*.62+'px';ball.style.transform=`translate(${c.offsetLeft+w*.19}px,${c.offsetTop+w*.19+extra}px)`}
function rgAfter(){if(RG&&RG.pieces&&document.getElementById('rg-board'))rgPlaceBall(RG.ballPos||RG.S,false)}
addEventListener('resize',()=>{if(RG&&!RG.busy)rgAfter()});
function rgRulesHtml(){return `<div class="wsrules"><div><b>1</b><span><strong>아래가 비면</strong> 떨어집니다.</span></div><div><b>2</b><span>바닥이 있으면 <strong>가던 방향</strong>으로 굴러갑니다. 처음엔 오른쪽.</span></div><div><b>3</b><span><strong>경사판 위</strong>에 올라서면 내리막 쪽으로 방향이 바뀝니다.</span></div><div><b>4</b><span><strong>막히면</strong> 반대로 튕깁니다. 판 아래로 떨어지면 실패.</span></div><div><b>5</b><span>블록 하나를 옮기거나 경사판을 뒤집으면 <strong>손대기 1개</strong>입니다.</span></div></div>`}
function rgTiersHtml(){const s=rgLimits('solo'),t=rgLimits('team'),row=(st,n,d)=>`<div><span class="wsstar">${st}</span><b>${n}</b><span>${d}</span></div>`;
 return `<div class="wstiers">${row('★★★',`최우수 · 개인 ${mcFmt(s.best)} / 팀 ${mcFmt(t.best)} 이내`,`최종 점수 <strong>${rgPts(RG_PTS.best)}</strong>`)}${row('★★☆',`우수 · 개인 ${mcFmt(s.good)} / 팀 ${mcFmt(t.good)} 이내`,`최종 점수 <strong>${rgPts(RG_PTS.good)}</strong>`)}${row('★☆☆','골인 · 시간 초과',`최종 점수 <strong>${rgPts(RG_PTS.done)}</strong>`)}${row('☆☆☆','기회를 모두 씀','0점 · 감점은 없습니다')}</div>`}
function rgView(){
 if(!rgPractice&&S.rollgame&&S.rollgame.tier)return rgResultView();
 if(!RG)rgInit();
 const exit=rgPractice&&RG.stage!=='intro'&&RG.stage!=='done'?'<div class="actions"><button class="small" data-action="rg-exit">체험 그만하기</button></div>':'';
 switch(RG.stage){case'warm':case'main':return rgPlayView()+exit;case'pick':return rgPickView()+exit;case'done':return rgResultView();default:return rgIntroView()}
}
function rgIntroView(){return `<section class="situation" data-day="GOAL"><div><div class="tag">${rgPractice?'체험 모드 · 점수 없음':'D+125 · 5라운드 직후 · 골인 챌린지'}</div><h1>잠깐 머리를 식히고 갑시다.<br><span style="color:var(--lime)">공을 골인시켜 보세요.</span></h1><p class="problem">블록 <b style="color:#fff">몇 개만</b> 옮겨서 공이 🏁까지 <b style="color:#fff">한 번에</b> 굴러가게 만드는 퍼즐입니다. <b style="color:#fff">빨리 풀수록 점수가 올라갑니다.</b></p></div><div class="speaker">${mcAvatar()}<div class="speech">“굴리기 전에, 머릿속으로 먼저 굴려보세요.”<small>리더(나)</small></div></div></section>

 :`<section class="panel"><h3>${main?(team?'팀전':'개인전'):'몸풀기'} · 목표</h3><p class="rg-goal">블록을 <b>${L.limit}개까지</b> 손대서<br>공을 🏁까지 굴리세요.${RG.triesMax===1?'<br><b>기회는 단 한 번!</b>':''}</p><p class="rg-tip">💡 ${L.tip}</p>

 return `<div class="eyebrow">${rgPractice?'체험 모드 · ':''}${main?`골인 챌린지 · ${team?'팀전':'개인전'} · ${L.size}`:'몸풀기 · 6×6 · 기록 없음'}</div>

<div class="rg-msg ${res?(res.ok?'ok':'no'):RG.failAt?'no':''}">${msg}</div>${rgBoardHtml()}${rgLegend()}</section>
<aside class="rg-side">${side}<section class="panel rg-rules"><h3>공은 이렇게 움직입니다</h3><ol><li><b>아래가 비면</b> 떨어집니다.</li><li>바닥이 있으면 <b>가던 방향</b>으로. 처음엔 오른쪽.</li><li><b>경사판 위</b>에서 내리막 쪽으로 바뀝니다.</li><li><b>막히면</b> 반대로 튕깁니다.</li><li>판 아래로 떨어지면 실패.</li></ol></section></aside></div>`}
function rgResultView(){const w=rgPractice?RG.result:S.rollgame,T=RG_TIER[w.tier],team=w.mode==='team',skipped=w.tier==='skip',ok=['best','good','done'].includes(w.tier);
 const showBoard=RG&&RG.pieces&&RG.key===w.mode&&!skipped;

 return `<div class="eyebrow">${rgPractice?'체험 모드 · ':''}골인 챌린지 · 결과</div><section class="panel navy wsresult"><div><div class="tag">${skipped?'건너뜀':(team?'팀전':'개인전')+(ok?' · 골인':' · 기회를 모두 씀')}</div><div class="wsbigstar">${T.s}</div><h1 style="color:#fff;margin:0 0 6px">${T.n}</h1><p class="muted" style="margin:0">${lines[w.tier]}</p></div><div class="wsnums">${skipped?'<p class="muted">시간 관계상 건너뛰었습니다.</p>':`<div><span>시간</span><b>${mcFmt(w.secs)}</b></div><div><span>굴린 횟수</span><b>${w.tries}번</b></div><div><span>최종 점수</span><b class="rg-ptsbig">${rgPts(w.pts)}</b></div>`}</div></section>
${showBoard?`<div class="rg-layout spacing"><section class="panel rg-wrap"><div class="rg-msg ${RG.demo?'':ok?'ok':'no'}">${RG.busy?'굴러가는 중…':RG.demo?'정답 시연 · 연두색 테두리가 손댄 블록입니다':ok?'우리 팀의 골인 경로':'마지막 배치 · '+RG_WHY[RG.lastWhy]}</div>${rgBoardHtml()}${rgLegend()}</section><aside class="rg-side"><section class="panel"><h3>${RG.demo?'정답 시연':'다시 보기'}</h3><p class="muted">${RG.demo?`${RG.L.answer.length}개만 손대면 됩니다. 정답은 하나뿐입니다.`:ok?'다른 조와 경로를 비교해보세요.':'정답은 하나뿐입니다. 어디가 달랐을까요?'}</p><button class="small" style="width:100%" data-action="rg-answer" ${RG.busy?'disabled':''}>🔍 정답 ${RG.demo?'다시 ':''}보기${rgPractice?'':' (진행자용)'}</button></section></aside></div>`:''}
${!skipped&&!rgPractice?`<div class="note spacing">✓ 최종 점수에 골인 보너스 ${rgPts(w.pts)}가 더해집니다.</div>`:''}
<section class="lesson spacing"><div class="lesson-k">1분 나눔</div><p class="lesson-t" style="font-size:21px">${team?'굴리기 전에 모두가 같은 경로를 예상했나요? 실제로 푼 사람은 몇 명이었고, 나머지는 동의만 하지 않았나요?':'처음 떠올린 방법이 맞았나요? 서두르다 확인을 건너뛴 순간은 없었나요?'}</p><div class="lesson-q"><b>6라운드 예고 · 한 사람에게 기댄 팀</b>${team?'방금 퍼즐을 누가 풀었는지 떠올려보세요. 그 사람이 빠졌다면 우리 팀은 골인했을까요?':'혼자 빨리 푸는 사람이 있으면 팀은 편합니다. 그 사람이 빠지면 어떻게 될까요?'}</div></section>
<div class="actions">${rgPractice?'<button class="primary big" data-action="rg-exit">체험 종료 → 원래 화면</button>':`<button class="primary big" data-action="rg-continue" ${RG&&RG.busy?'disabled':''}>다음 라운드 → 6라운드</button>`}</div>`}
function rgConfetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#d5ec8c','#0a8070','#f3c54a','#d4602c','#5a73b6'];for(let k=0;k<70;k++){const p=document.createElement('i');p.className='rg-cf';p.style.left=Math.random()*100+'vw';p.style.background=cols[k%5];p.style.animationDelay=Math.random()*.6+'s';p.style.animationDuration=1.6+Math.random()*1.4+'s';document.body.append(p);setTimeout(()=>p.remove(),3800)}}

function toast(t){const el=document.getElementById('toast');el.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>el.textContent='',4200)}
function render(){save();const ep=episodePending()&&!new URLSearchParams(location.search).has('admin');document.body.classList.toggle('episode-mode',ep);if(ep){if(typeof pcHide==='function')pcHide();document.getElementById('app').innerHTML=episodeView();return;}if(typeof pcHide==='function')pcHide();document.getElementById('app').innerHTML=wsPractice?shell(workshopView()):rgPractice?shell(rgView()):shell(S.stage===0?mission():S.stage===1?leaderView():S.stage===2?teamView():S.stage===3?(wsInWorkshop()?workshopView():rgActive()?rgView():S.feedback?feedbackView():roundView()):finalView());rgAfter();requestAnimationFrame(animateCounts)}
function animateCounts(){const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,from=+el.dataset.from||0,dec=+el.dataset.dec||0;if(reduce){el.textContent=to.toFixed(dec);return}const t0=performance.now(),dur=1100;const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=(from+(to-from)*e).toFixed(dec);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step);el.removeAttribute('data-count')});setTimeout(()=>document.querySelectorAll('[data-w]').forEach(el=>{el.style.width=el.dataset.w+'%';el.removeAttribute('data-w')}),60)}
function goTop(){window.scrollTo({top:0,behavior:'smooth'})}
function download(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function advanceRound(){if(S.round===6){S.stage=4;recordResult(makeRecord());setTimeout(()=>axSubmit(),0)}else{S.round++;S.feedback=false;S.pick=null;S.ivs=[];S.note='';S.move=null}}
function canDecide(){return S.stage===3&&!S.feedback&&S.assignDone&&!S.assignEditing&&(S.round>0||S.kickoffDone)&&!wsInWorkshop()&&!rgActive()}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
 const a=b.dataset.action,id=Number(b.dataset.id);let top=false;
 switch(a){
 case'episode-enter':if(episodePending()){S.episodeSeen=[...new Set([...(S.episodeSeen||[]),S.round])];top=true;}break;
 case'episode-revisit':if(canDecide()){S.episodeSeen=(S.episodeSeen||[]).filter(n=>n!==S.round);top=true;}break;
 case'guide':return guideModal();
 case'fac':return facModal();
 case'ranking':location.href='?admin=1';return;
 case'close':return document.getElementById('modal').close();
 case'print':return window.print();
 case'person':return personModal(id);
 case'export':if(S.stage!==4)return;return download(makeRecord(),'AX_TF_결과_'+S.name.replace(/[^\w가-힣-]+/g,'_')+'.json');
 case'import':return document.getElementById('import').click();
 case'present':document.body.classList.toggle('present');try{localStorage.setItem(KEY+'-present',document.body.classList.contains('present')?'1':'')}catch(err){}return facModal();
 case'nums':try{localStorage.setItem(KEY+'-nums',showNums()?'':'1')}catch(err){}render();return facModal();
 case'timer':clearInterval(timer.int);timer.end=id?Date.now()+id*60000:null;if(id)timer.int=setInterval(tickTimer,1000);tickTimer();document.getElementById('modal').close();if(id)toast(id+'분 타이머를 시작했습니다.');return;
 case'fac-event':{if(!canDecide())return;const l=S.facEvents[S.round]||[];S.facEvents[S.round]=l.includes(b.dataset.id)?l.filter(x=>x!==b.dataset.id):[...l,b.dataset.id];save();render();facModal();return}
 case'clear-ranks':if(!confirm('이 브라우저의 팀 비교 기록을 모두 지울까요?'))return;try{localStorage.removeItem(RANKKEY)}catch(err){}memoryRanks=[];return rankingModal();
 case'reset':if(S.stage===4&&!S.cloudSubmitted&&!confirm('결과 제출이 확인되지 않았습니다. PDF 또는 JSON을 먼저 저장하는 것을 권장합니다. 그래도 새로 시작할까요?'))return;if(!confirm('처음부터 새 팀으로 시작할까요? 팀 비교 기록은 유지됩니다.'))return;wsReset();rgReset();rgPractice=false;S=fresh();document.getElementById('modal').close();top=true;break;
 case'start':{const session=document.getElementById('sessionname').value.trim();if(!session){toast('교육 회차를 입력해주세요.');return}S.session=session;const n=document.getElementById('teamname').value.trim();if(!n){toast('팀 이름을 입력해주세요.');document.getElementById('teamname').focus();return}S.name=n;S.stage=1;top=true;break}
 case'leader':if(S.stage===1)S.leaderType=b.dataset.id;break;
 case'mode':if(S.stage===0){S.session=document.getElementById('sessionname').value.trim();S.mode=b.dataset.id==='solo'?'solo':'team';const n=document.getElementById('teamname');if(n)S.name=n.value}break;
 case'to-team':if(S.leaderType){S.stage=2;top=true}break;
 case'back':if(S.stage>0&&S.stage<3){S.stage--;top=true}break;
 case'select-person':if(S.stage===2){if(S.team.includes(id))S.team=S.team.filter(x=>x!==id);else if(S.team.length<4)S.team.push(id)}break;
 case'launch':if(S.stage===2&&S.team.length===4){S.stage=3;S.assignments=Array(NT).fill(null);top=true}break;
 case'assign':{const i=Number(b.dataset.task);if(S.stage===3&&(!S.assignDone||S.assignEditing))S.assignments[i]=id;break}
  case'edit-work':if(S.stage===3&&!S.feedback){S.assignBackup=[...S.assignments];S.assignEditing=true;S.move=null;S.pick=S.pick!==null&&ROUNDS[S.round].options[S.pick].move?null:S.pick;top=true}break;
 case'cancel-work':if(S.assignBackup)S.assignments=[...S.assignBackup];S.assignEditing=false;top=true;break;
 case'confirm-work':if(S.stage===3&&assignValid()){S.assignDone=true;S.assignEditing=false;if(!S.kickoffDone)S.initialAssignments=[...S.assignments];top=true}break;
 case'kickoff-next':if(S.stage===3&&S.round===0){const m=document.getElementById('kickmsg');S.kickMsg=m?m.value.trim():'';S.kickoffDone=true;top=true}break;
 case'choose':if(canDecide()){S.pick=id;const o=ROUNDS[S.round].options[id];S.move=o.move?suggestMove(o.move):null}break;
 case'add-iv':{if(!canDecide())return;const t=b.dataset.type,d=IV[t];if(ivCost()+d.cost>leaderTime())return toast('리더 시간이 부족합니다.');const iv={type:t};d.targets.forEach((_,j)=>{const v=Number(document.getElementById('iv-'+t+'-'+j).value);if(j===0)iv.a=v;else iv.b=v});if(t==='pair'&&iv.a===iv.b)return toast('코치와 배우는 사람은 달라야 합니다.');if(S.ivs.some(x=>x.type===t&&x.a===iv.a&&x.b===iv.b))return toast('이미 추가했습니다.');S.ivs.push(iv);break}
 case'del-iv':S.ivs.splice(id,1);break;
 case'commit':if(canDecide()&&S.pick!==null&&moveReady()){const r=document.getElementById('reason');S.note=r?r.value:'';commitRound();top=true}break;
 case'next':if(S.feedback&&!wsInWorkshop()&&!rgActive()){if(S.round===1&&!S.workshop){S.workshop={done:false};wsReset()}else if(S.round===4&&!S.rollgame){S.rollgame={done:false};rgReset()}else advanceRound();top=true}break;
 case'rg-warm':if(rgActive()&&RG&&RG.stage==='intro')return rgStartWarm();return;
 case'rg-skipwarm':if(rgActive()&&RG&&RG.stage==='intro'){RG.warmOk=null;return rgToPick()}return;
 case'rg-pick':if(rgActive()&&RG&&RG.stage==='warm'&&RG.res){RG.warmOk=RG.res.ok;return rgToPick()}return;
 case'rg-solo':case'rg-team':if(rgActive()&&RG&&RG.stage==='pick')return rgStartMain(a==='rg-solo'?'solo':'team');return;
 case'rg-people':if(RG)RG.people=id;break;
 case'rg-cell':return rgClick(Number(b.dataset.x),Number(b.dataset.y));
